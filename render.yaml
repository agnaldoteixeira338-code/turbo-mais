# =============================================================================
# Render Blueprint — BACKEND do Turbo Mais (Dashboard → New → Blueprint).
#
# Hospedagem (ADR-011):
#   frontend  → Vercel   (frontend/vercel.json)
#   backend   → Render   (este arquivo: API + workers)
#   Postgres  → Neon     ·  Redis → Upstash
#
# autoDeploy: false → quem faz deploy é o cd.yml, DEPOIS do CI verde e das
# migrations, com healthcheck e rollback automático (ADR-010, docs/DEPLOY.md).
# =============================================================================
services:
  - type: web
    name: turbo-mais-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    autoDeploy: false
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      # Caminho da requisição: navegador → Vercel (rewrite /api) → Render → API.
      # 2 proxies confiáveis = a API enxerga o IP real do usuário (rate limit).
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_URL
        sync: false # Neon (pooled): postgres://...-pooler.../neondb?sslmode=require
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false # Upstash: rediss://default:<senha>@<host>:6379
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_RESET_SECRET
        generateValue: true
      - key: JWT_2FA_SECRET
        generateValue: true
      - key: CODE_HMAC_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Domínio do frontend na Vercel (usado pelo CORS do Socket.IO e nos links de e-mail)
      - key: CORS_ORIGINS
        sync: false # ex.: https://turbo-mais.vercel.app
      - key: FRONTEND_URL
        sync: false # ex.: https://turbo-mais.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MARKET_DATA_MODE
        value: live
      - key: BRAPI_TOKEN
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      # Plano free não tem background worker: workers rodam no processo da API
      # (trade-off na ADR-009). Com plano pago: "false" + serviço worker abaixo.
      - key: RUN_WORKERS_IN_PROCESS
        value: "true"

  # Worker dedicado (plano pago). Mesma imagem, outro comando. Ao ativar:
  # descomente, copie as mesmas variáveis da API e defina RUN_WORKERS_IN_PROCESS=false.
  # - type: worker
  #   name: turbo-mais-worker
  #   runtime: docker
  #   rootDir: backend
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: node src/worker.js
  #   plan: starter
  #   region: ohio
  #   autoDeploy: false
