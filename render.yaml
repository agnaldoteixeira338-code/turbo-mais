  #     - fromGroup: turbo-mais-backend

  - type: web
    name: turbo-mais
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_SOCKET_URL
        sync: false # https://turbo-mais-api.onrender.com
    routes:
      # API na MESMA ORIGEM do site (cookie SameSite=Strict, sem CORS)
      - type: rewrite
        source: /api/*
        destination: https://turbo-mais-api.onrender.com/api/*
      # SPA: qualquer rota volta para o index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://turbo-mais-api.onrender.com wss://turbo-mais-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
