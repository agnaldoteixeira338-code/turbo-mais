# =============================================================================
# Turbo Mais — ambiente completo com UM comando:  docker compose up --build
#
#   http://localhost:8080        app (Nginx + SPA, proxy para a API)
#   http://localhost:3333/api/docs  Swagger
#   http://localhost:8025        Mailpit (caixa de e-mails de dev: reset/2FA)
#
# Login demo: demo@turbomais.dev / Demo@12345
# Por padrão usa dados de mercado SIMULADOS (sem chaves de API). Para dados
# reais: MARKET_DATA_MODE=live no .env (veja .env.example).
# =============================================================================
name: turbo-mais

x-backend-env: &backend-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://turbo:${POSTGRES_PASSWORD:-turbo_dev_password}@postgres:5432/turbo_mais
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-0123456789abcdefghijklmn}
  JWT_RESET_SECRET: ${JWT_RESET_SECRET:-dev-only-reset-secret-0123456789abcdefghijklmno}
  JWT_2FA_SECRET: ${JWT_2FA_SECRET:-dev-only-2fa-secret-0123456789abcdefghijklmnopq}
  CODE_HMAC_SECRET: ${CODE_HMAC_SECRET:-dev-only-hmac-secret-0123456789abcdefghijklmno}
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  FRONTEND_URL: http://localhost:8080
  COOKIE_SECURE: "false"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  MARKET_DATA_MODE: ${MARKET_DATA_MODE:-mock}
  MARKET_DATA_FALLBACK_SIMULADO: ${MARKET_DATA_FALLBACK_SIMULADO:-true}
  BRAPI_TOKEN: ${BRAPI_TOKEN:-}
  ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
  COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
  SEED_DEMO_USER: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turbo_dev_password}
      POSTGRES_DB: turbo_mais
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turbo -d turbo_mais"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction é OBRIGATÓRIO para o BullMQ (jobs não podem ser despejados da memória)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP de desenvolvimento: captura os e-mails de reset/2FA (UI em :8025).
  # Sem healthcheck/depends_on de propósito: e-mail é assíncrono (fila com
  # retry), então a API não precisa esperar o SMTP para subir.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  # One-shot: aplica migrations (Prisma) + seeds e termina. A API só sobe depois.
  migrate:
    build:
      context: ./backend
      target: migrator
      additional_contexts:
        database: ./database
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    ports: ["3333:3333"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # MESMA imagem da API, outro comando (build once, run many)
  worker:
    build:
      context: ./backend
      target: runtime
    command: ["node", "src/worker.js"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3334/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_UPSTREAM: http://backend:3333
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
