<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Código de verificação</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f3f7;font-family:Arial,Helvetica,sans-serif;color:#1f1f1f;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="background:#820ad1;padding:24px 32px;color:#ffffff;font-size:22px;font-weight:bold;">
                Turbo Mais
                <div style="font-size:13px;font-weight:normal;opacity:.85;margin-top:4px;">Acelere suas decisões de investimento</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;text-align:center;">
                <h1 style="font-size:20px;margin:0 0 12px;">Seu código de verificação</h1>
                <p style="font-size:15px;line-height:1.6;margin:0 0 24px;">Digite o código abaixo no Turbo Mais para continuar.</p>
                <div style="display:inline-block;font-size:34px;letter-spacing:10px;font-weight:bold;background:#f3e8fb;color:#820ad1;padding:16px 24px;border-radius:12px;">{{codigo}}</div>
                <p style="font-size:13px;line-height:1.6;color:#6b6b6b;margin:24px 0 0;">
                  Válido por <strong>{{validadeMinutos}} minutos</strong>. Nunca compartilhe este código com ninguém —
                  nem com quem diga ser do Turbo Mais.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
