# =============================================================================
# Segurança automatizada — em todo PR e semanalmente (vulnerabilidades novas
# aparecem em dependências que não mudaram).
# =============================================================================
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # segundas, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Falha com vulnerabilidade crítica; relata as altas
        working-directory: ${{ matrix.app }}
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm audit --omit=dev --audit-level=critical

  snyk:
    name: Snyk (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso quando o token não está configurado
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN não configurado — scan do Snyk pulado (veja docs/SECURITY.md)"
      - uses: actions/setup-node@v4
        if: env.SNYK_TOKEN != ''
        with:
          node-version: "22"
      - name: Instala dependências
        if: env.SNYK_TOKEN != ''
        working-directory: ${{ matrix.app }}
        run: npm ci --ignore-scripts
      - name: Snyk test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --file=${{ matrix.app }}/package.json --severity-threshold=high --sarif-file-output=snyk-${{ matrix.app }}.sarif
      - name: Envia resultados ao GitHub Code Scanning
        if: env.SNYK_TOKEN != '' && always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: snyk-${{ matrix.app }}.sarif
          category: snyk-${{ matrix.app }}
    permissions:
      contents: read
      security-events: write

  trivy:
    name: Trivy — imagem ${{ matrix.imagem.nome }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        imagem:
          - { nome: api, contexto: backend, target: runtime }
          - { nome: web, contexto: frontend, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.imagem.contexto }}
          target: ${{ matrix.imagem.target }}
          load: true
          tags: turbo-mais-${{ matrix.imagem.nome }}:scan
      - name: Relatório SARIF (todas as severidades relevantes)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: turbo-mais-${{ matrix.imagem.nome }}:scan
          format: sarif
          output: trivy-${{ matrix.imagem.nome }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.imagem.nome }}.sarif
          category: trivy-${{ matrix.imagem.nome }}
      - name: Bloqueia CRÍTICAS com correção disponível
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: turbo-mais-${{ matrix.imagem.nome }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-js

  dependency-review:
    name: Revisão de dependências do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
