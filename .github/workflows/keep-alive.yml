# Mantém a API acordada: a Render gratuita "dorme" após 15 min sem tráfego e o
# primeiro acesso depois disso leva ~1 min. Um ping a cada 10 min evita isso.
#
# O agendador do GitHub pode atrasar alguns minutos em horários de pico; por
# isso este job é a camada de reserva de um monitor externo (UptimeRobot), que
# também alerta por e-mail se a API cair. Ver docs/DEPLOY.md.
name: Keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: GET /health
        run: |
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 \
            -o /dev/null -w 'HTTP %{http_code} em %{time_total}s\n' \
            https://turbo-mais-api.onrender.com/health
