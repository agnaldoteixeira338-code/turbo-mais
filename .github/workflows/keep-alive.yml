# Mantém a API acordada em horário de pico (seg–sex, 9h–18h de Brasília): a
# Render gratuita "dorme" após 15 min sem tráfego e o primeiro acesso depois
# disso leva ~1 min.
#
# ⚠️ DESATIVADO no GitHub (Actions → Keep-alive → Enable workflow para ligar).
# As 750 h/mês grátis da Render são da CONTA inteira, não por serviço, e hoje
# outro serviço da mesma conta já fica acordado 24h. Ligar este job estouraria
# o limite e a Render suspenderia todos os serviços gratuitos até o mês seguinte.
# Ligue só se houver horas sobrando (ou com a API no plano pago). Ver docs/DEPLOY.md.
name: Keep-alive

on:
  schedule:
    # 12h–21h50 UTC = 9h–18h50 em Brasília (UTC−3, sem horário de verão)
    - cron: '*/10 12-21 * * 1-5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: GET /health
        run: |
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 \
            -o /dev/null -w 'HTTP %{http_code} em %{time_total}s\n' \
            https://turbo-mais-api.onrender.com/health
