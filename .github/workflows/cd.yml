# =============================================================================
# CD — a cada merge na main:
#   1. CI completo (reutilizado) — nada vai para produção sem testes verdes
#   2. migrations no Neon (SÓ aditivas — expand/contract, ADR-010)
#   3. BACKEND na Render: deploy da API → espera ficar "live" → healthcheck
#      └─ falhou? ROLLBACK automático para o deploy anterior
#   4. FRONTEND na Vercel: build + deploy de produção → healthcheck do SPA e
#      do rewrite /api → Render └─ falhou? `vercel rollback` automático
#   5. smoke test ponta a ponta (navegador → Vercel → Render → Neon)
#
# Ordem importa: a API sobe ANTES do front, então um front novo nunca chama
# uma API velha (o contrato da v1 só evolui de forma aditiva — ADR-006).
# Hospedagem: ver ADR-011.
#
# Secrets necessários (Settings → Secrets → Actions): veja docs/DEPLOY.md
# =============================================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false # nunca cancelar um deploy no meio

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Enquanto Neon/Render/Vercel não estiverem configurados, o CD roda o CI e
  # pula o deploy com um aviso — em vez de falhar e deixar a main vermelha.
  configuracao:
    name: Deploy configurado?
    runs-on: ubuntu-latest
    outputs:
      pronto: ${{ steps.verificar.outputs.pronto }}
    steps:
      - id: verificar
        env:
          NEON: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          RENDER: ${{ secrets.RENDER_API_KEY }}
          VERCEL: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$NEON" ] && [ -n "$RENDER" ] && [ -n "$VERCEL" ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy ainda não configurado (faltam secrets — veja docs/DEPLOY.md). CI executado; deploy pulado."
          fi

  migrations:
    name: Migrations no Neon
    needs: [ci, configuracao]
    if: needs.configuracao.outputs.pronto == 'true'
    runs-on: ubuntu-latest
    environment: producao
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: prisma migrate deploy (idempotente; registra em _prisma_migrations)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
        run: npx prisma migrate deploy --schema ../database/schema.prisma
      - name: Seeds do catálogo (upsert idempotente)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          DATABASE_SSL: "true"
          SEED_DEMO_USER: ${{ vars.SEED_DEMO_USER || 'false' }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
        run: npm run db:seed

  deploy-api:
    name: Deploy da API na Render (com rollback)
    needs: migrations
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ vars.API_URL }}/api/docs
    steps:
      - uses: actions/checkout@v7
      - name: Deploy + healthcheck + rollback automático
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_API }}
          HEALTH_URL: ${{ vars.API_URL }}/ready
          COMMIT: ${{ github.sha }}
        run: bash .github/scripts/render-deploy.sh

  deploy-worker:
    name: Deploy do worker na Render
    needs: deploy-api
    if: vars.RENDER_HAS_WORKER == 'true'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v7
      - env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_WORKER }}
          HEALTH_URL: ""
          COMMIT: ${{ github.sha }}
        run: bash .github/scripts/render-deploy.sh

  deploy-frontend:
    name: Deploy do frontend na Vercel (com rollback)
    needs: deploy-api
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build + deploy + healthcheck + rollback automático
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: bash .github/scripts/vercel-deploy.sh

  smoke:
    name: Smoke test pós-deploy (ponta a ponta)
    needs: [deploy-api, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: API na Render — /health completo e Swagger
        run: |
          curl -fsS "${{ vars.API_URL }}/health" | tee health.json
          grep -q '"postgres":{"nome":"postgres","status":"ok"' health.json
          curl -fsS -o /dev/null "${{ vars.API_URL }}/api/docs/"
      - name: Frontend na Vercel — SPA, rotas do React e cabeçalhos de segurança
        run: |
          curl -fsS -o /dev/null "${{ vars.FRONTEND_URL }}/"
          curl -fsS -o /dev/null "${{ vars.FRONTEND_URL }}/buscar"
          curl -fsSI "${{ vars.FRONTEND_URL }}/" | tee headers.txt
          grep -qi "content-security-policy" headers.txt
          grep -qi "x-frame-options: deny" headers.txt
      - name: Caminho completo — Vercel → rewrite /api → Render → Neon
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ vars.FRONTEND_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" -d '{"email":"smoke@teste.invalid","senha":"x"}')
          echo "login via rewrite: HTTP ${status} (esperado 401)"
          test "${status}" = "401"
